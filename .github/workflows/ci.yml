name: BorsaBi checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs_space
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: borsabi
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: borsabi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U borsabi -d borsabi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://borsabi:test-only@localhost:5432/borsabi_test
      TEST_DATABASE_URL: postgresql://borsabi:test-only@localhost:5432/borsabi_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: isolated-ci-test-secret-never-use-in-production
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npx prisma db push
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
